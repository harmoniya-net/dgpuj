[package]
name = "dgpuj"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "java, on the discrete GPU of a hybrid-graphics machine (NVIDIA Optimus / AMD PowerXpress / PRIME)."
repository = "https://github.com/harmoniya-net/dgpuj"
readme = "README.md"

[[bin]]
name = "dgpuj"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
