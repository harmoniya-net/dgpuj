# Link the C runtime into dgpuj.exe. Left dynamic, the binary needs
# VCRUNTIME140.dll from the Visual C++ redistributable, which a clean Windows
# does not have: it would fail to start before it had found the JDK that
# carries a copy.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
