name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # The oldest a game still asks for, the one most do, and the newest.
        java: ['8', '17', '25']
        include:
          # Windows on ARM, where an image is built differently and cannot be
          # run anywhere else. Never in the way of the rest.
          - { os: windows-11-arm, java: '21', target: aarch64-pc-windows-msvc, experimental: true }
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Two JDKs: the one the tests launch, and another to put on PATH, since
      # picking up a stranger's java.dll from there is one of the things tested.
      - uses: actions/setup-java@v5
        with: { distribution: zulu, java-version: '17' }
      - run: echo "OTHER_JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with: { distribution: zulu, java-version: '${{ matrix.java }}' }
      # A static binary a few kilobytes long, as a release is built.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - run: sh build.sh ${{ matrix.target }}
      - run: sh test.sh
