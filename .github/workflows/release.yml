name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Static against musl, so that the binary asks nothing of the libc of
      # the machine it lands on.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y musl-tools
          echo "CC=musl-gcc" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - run: make TARGET=${{ matrix.target }}
      # An archive, so that unpacking restores the +x bit on Unix (consumers
      # like @opys/dgpuj extract a single file). .zip on Windows, .tar.gz
      # elsewhere; the binary sits at the archive root.
      - name: Package archive
        run: |
          mkdir -p dist
          out="$PWD/dist/dgpuj-${{ matrix.target }}"
          if [ -f dgpuj.exe ]; then
            7z a "$out.zip" dgpuj.exe >/dev/null
          else
            tar -czf "$out.tar.gz" dgpuj
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: dgpuj-${{ matrix.target }}
          path: dist/dgpuj-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dgpuj-*
          generate_release_notes: true
          fail_on_unmatched_files: true
